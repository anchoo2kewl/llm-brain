# Test the Tauri desktop client on Linux and build it for Windows on every pull request that touches it. No release:
# the Windows files go to the run's artifacts only. client-release.yml builds and publishes from a client-v* tag.
name: client-build

on:
  pull_request:
    paths:
      - "app/**"
      - "attach/cmd/brain-update/**"
      - ".github/workflows/client-build.yml"
      - ".github/workflows/client-release.yml"
      - "hub/internal/web/static/**"
      - "tests/*.test.mjs"

permissions:
  contents: read

concurrency:
  group: client-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable, 2026-10-16
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: app/src-tauri
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: attach/go.mod
          cache-dependency-path: attach/go.sum
      - name: Linux build packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Tests and lint (Linux-only code too, for example the updater and the restart sign)
        run: |
          cargo test --manifest-path app/src-tauri/Cargo.toml --locked
          cargo clippy --manifest-path app/src-tauri/Cargo.toml --locked --all-targets -- -D warnings
          node --test app/tests/*.test.mjs tests/*.test.mjs
          (cd attach && go test ./cmd/brain-update)

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable, 2026-10-16
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: app/src-tauri
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: attach/go.mod
          cache-dependency-path: attach/go.sum
      - name: Tests, lint and Windows installers
        working-directory: app
        shell: bash
        run: |
          npm ci
          (cd ../attach && go test ./cmd/brain-update)
          cargo test --manifest-path src-tauri/Cargo.toml --locked
          cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings
          node --test tests/*.test.mjs
          npx tauri build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: BrainHub-windows
          path: |
            app/src-tauri/target/release/bundle/msi/*.msi
            app/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
