# llm-brain fleet config. Shared by every machine; per-machine overrides go in
# ~/.config/llm-brain/local.yaml (same keys, merged on top).

# Kill switch for every machine. A single machine can also pause itself with
# `touch ~/.config/llm-brain/PAUSE`.
paused: false

# Which LLM CLIs this machine can use. A provider is "available" when it is
# enabled here AND its CLI is on PATH.
providers:
  claude:
    enabled: true
    cli: claude
    model: sonnet      # explicit fleet default; do not inherit an interactive Opus/1M setting
  codex:
    enabled: true
    cli: codex
    model: ""          # empty = ~/.codex/config.toml default
  gemini:
    enabled: false
    cli: gemini
    model: ""

# Account gateway (CLIProxyAPI on the Mac Studio). Holds every subscription login;
# personal accounts carry priority 10, work priority 0, routing is fill-first, so work
# is used only while personal is exhausted (429/quota cooldown) and personal resumes
# automatically after its reset. Edit credential priority ONLY with the gateway stopped
# (a live rewrite can resurrect a spent refresh token).
gateway:
  enabled: true
  url: http://127.0.0.1:8317            # other machines: http://<gateway-host>:8317
  env_file: ~/.config/llm-brain/cpa.env # CPA_API_KEY (client key), CPA_MGMT_KEY — not in git

# Roles. The reviewer is ALWAYS a different provider from the implementer when
# a second one is available; only when exactly one provider is available does
# the implementer review its own work (in a fresh session, with no shared context).
roles:
  implementer: claude
  reviewer: codex

# Who this fleet works for. Real values go in your overlay (see README); these are placeholders.
owner:
  name: ""
  github: ""                    # your GitHub login
  notify: ""                    # e.g. slack-self-dm; empty = macOS notification only

people: {}                      # GitHub handle -> display name, e.g. {octocat: Mona}
work_root: ~/work               # where your repos live; workers make worktrees here
hub_url: http://127.0.0.1:8787  # where shippers send data
host_name: ""                   # how this machine is named in comments and notifications; empty = `hostname -s`.
                                # Set it per machine in ~/.config/llm-brain/local.yaml. Claims still use `hostname -s`.

# Intake: every open issue assigned to the owner whose author is in `authors`. No label needed.
intake:
  repos: []                     # e.g. [acme/platform]
  assignee: ""                  # usually owner.github
  authors: []                   # who may hand you work, e.g. [teammate-a, teammate-b]
  created_since: "1970-01-01"   # ignore older backlog
  skip_labels: [agent:stop, agent:done]
  max_in_flight: 2              # issues the fleet owns at once; the next starts when one is closed/merged
  skip_if_my_open_pr: true      # an issue you're already working by hand is left alone

# Labels the fleet writes (created once by `fleet labels`).
labels:
  claimed: agent:working
  pr_open: agent:pr-open
  blocked: agent:blocked
  stop: agent:stop
  done: agent:done          # worker found nothing to build (e.g. only a UAT check left)

# PRs the babysitter owns carry this marker in their body.
pr_marker: "llm-brain:issue="
pr_owners: []                   # orgs to search for fleet PRs, e.g. [acme]
reviewers: []                   # always requested on every PR

# Component 3: review every PR that requests (or @-mentions) the owner.
pr_review:
  enabled: true
  provider: claude
  model: ""                     # optional override; otherwise providers.<provider>.model
  owners: []                    # orgs to watch, e.g. [acme]
  repo_regex: ".*"              # narrow to some repos
  updated_since: "1970-01-01"   # skip stale review requests
  post: true                    # false = dry run (write the review to a file)
  # Rules are a UNION over modules; each module decides by itself whether it applies
  # (fuzzy "when": repo globs, file globs, keywords in the diff). Plug-and-play:
  #   - ocr                       open-code-review language rules + the repo's .opencodereview/rule.json
  #   - <name>                    review-rules/<name>/ here, or <overlay>/rules/<name>/
  #   - {name, git, path}         any git repo with an OCR-format rule.json
  rule_modules: [security, ocr, multitenant, migrations, contracts]
  extra_rule_modules: []        # your overlay's private modules

# AI Slop Score (docs/slop-score.md): a 0-100 taste and PR-hygiene score posted on every review.
# A blocked score stops the review approving and sets a failing `ai-slop-score` commit status, which
# branch protection can require. The fleet's own PRs must get under the block line before they merge.
slop:
  enabled: true
  profiles: [default]           # the first whose `when` matches the repo is used; an overlay sets e.g. [acme, default]
  post_status: true             # set the ai-slop-score commit status (only when pr_review.post is true)
  backfill_per_tick: 3          # PRs reviewed before the score existed get it as a comment, this many per tick

limits:
  max_workers: 3               # concurrent implement/babysit LLM workers on this machine
  max_review_workers: 3         # PR reviews run separately, in parallel
  implement_timeout: 4h
  babysit_timeout: 2h
  review_timeout: 30m

# Merge policy. dev-only: merging to the default branch deploys to dev; the
# fleet never opens or merges staging/production promotion PRs.
merge:
  auto: true
  require_approval: true
  require_full_ci: true         # every required check, including slow/merge-queue ones
  require_internal_review_clean: true

notify:
  slack_self_dm: false          # DM the owner on merge / block (needs a Slack tool in the worker)
  macos: true

# Team chat. The hub holds the Slack connection and picks what to watch (channels, all your DMs,
# mentions of you anywhere) at /settings/slack; bin/chat-watch reads new messages from the hub every
# tick. Messages from `trusted` people that name an issue/PR become notes the workers act on, like
# review comments; an LLM pass writes a short digest and can stop a fleet issue when a trusted person says so.
# Identity comes from owner.name/github/slack_user_id; optional owner.aliases are addressing labels, not trust.
chat:
  enabled: false
  hub_url: http://127.0.0.1:8787
  trusted: {}                   # Slack user id -> GitHub handle (a key of `people`), e.g. {U0000000002: teammate-a}
  channel_repos: {}             # channel name -> repo a bare #123 means there, e.g. {handoff: acme/web}
  repos: []                     # extra repos for short refs like web#12 (intake repos and the overlay's repos.txt are always known)
  insights: true
  provider: claude
  model: ""                     # e.g. sonnet: a quick model is plenty for a digest

# Shared agent memory (hub /memory). With `enabled`, every worker's prompt gets the context pack for its repo,
# issue/PR and folder (bin/brain-context: what other agents learned, and who else is on it right now) and is
# told to save lessons with bin/brain-remember. It fails open: no hub, no change to the prompt.
memory:
  enabled: false
  hub_url: http://127.0.0.1:8787
  k: 8                          # memories per prompt
